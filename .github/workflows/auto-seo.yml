name: Auto SEO Sitemap & Robots

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "sitemap.xml"
      - "robots.txt"

permissions:
  contents: write

jobs:
  update-seo-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate robots.txt and sitemap.xml
        run: |
          BASE_URL="https://pocketdocs.byronchakma2016.workers.dev"
          TODAY=$(date -u +%Y-%m-%d)

          cat << EOF > robots.txt
          User-agent: *
          Allow: /

          Sitemap: ${BASE_URL}/sitemap.xml
          EOF

          cat << EOF > sitemap.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>${BASE_URL}/</loc>
              <lastmod>${TODAY}</lastmod>
              <changefreq>weekly</changefreq>
              <priority>1.0</priority>
            </url>
          </urlset>
          EOF

      - name: Commit SEO Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add robots.txt sitemap.xml
          git diff --staged --quiet || git commit -m "chore: update robots.txt and sitemap.xml"
          git push
